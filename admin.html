<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Admin Panel</title>
  <style>
    body { font-family: system-ui, -apple-system, Arial; padding: 20px; max-width: 720px; margin: auto; background:#f7fafc }
    .card { border: 1px solid #e5e7eb; padding: 16px; border-radius: 8px; background:#fff; margin-bottom:12px }
    input, button, select, textarea { font-size: 14px; padding: 8px; margin-top:6px; width:100%; box-sizing:border-box; }
    button { cursor: pointer }
    .hidden{display:none}
  </style>
</head>
<body>
  <h1>Admin Panel</h1>

  <div id="loginCard" class="card">
    <h2>Sign in</h2>
    <p>Enter admin password (will be checked server-side).</p>
    <input id="adminPassword" type="password" placeholder="Admin password">
    <button id="loginBtn">Sign in</button>
    <p id="loginStatus" style="color:crimson"></p>
  </div>

  <div id="adminArea" class="card hidden">
    <h2>Admin actions</h2>
    <button id="logoutBtn">Sign out</button>
    <h3>Open issues labeled suggestion/complaint</h3>
    <ul id="issuesList">Loading…</ul>
  </div>

  <script src="admin.js"></script>
</body>
</html>
